name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The suite runs entirely on a synthetic corpus, so CI never downloads the
      # 20 Newsgroups dataset. A test that needs a dataset server to be up is a
      # test that eventually fails for reasons unrelated to the code.
      - name: Run tests
        run: pytest -q

      - name: Check the package imports cleanly
        run: python -c "import news_classifier; print(news_classifier.__version__)"
